<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Síða fannst ekki | Avara</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy-900: #0a1628;
      --navy-800: #0f213e;
      --navy-700: #16305a;
      --blue-500: #2d5fd6;
      --blue-400: #4d7df0;
      --cyan-300: #67c1ff;
      --ink-900: #0f172a;
      --ink-500: #64748b;
      --radius-lg: 24px;
      --gradient-primary: linear-gradient(135deg, #0f213e 0%, #1c3d68 50%, #2d5fd6 100%);
      --gradient-accent: linear-gradient(135deg, #67c1ff 0%, #2d5fd6 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #060d1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow: hidden;
      color: white;
    }

    .bg-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #060d1a 0%, #0a1a33 50%, #0d1f3d 100%);
    }

    .bg-scene::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(45, 95, 214, 0.35) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 30%, rgba(16, 185, 129, 0.18) 0%, transparent 45%),
        radial-gradient(ellipse at 70% 80%, rgba(103, 193, 255, 0.2) 0%, transparent 50%);
      animation: aurora 16s ease-in-out infinite alternate;
    }

    @keyframes aurora {
      0% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
      100% { opacity: 0.8; transform: scale(1.02); }
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
      animation: float 12s ease-in-out infinite;
    }
    .orb-1 { width: 400px; height: 400px; background: rgba(45, 95, 214, 0.4); top: -100px; left: -100px; }
    .orb-2 { width: 350px; height: 350px; background: rgba(16, 185, 129, 0.2); bottom: -100px; right: -80px; animation-delay: -4s; }
    .orb-3 { width: 250px; height: 250px; background: rgba(103, 193, 255, 0.25); top: 50%; left: 60%; animation-delay: -8s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); }
      33% { transform: translateY(-30px) translateX(20px); }
      66% { transform: translateY(20px) translateX(-20px); }
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(103, 193, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(103, 193, 255, 0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center, black 0%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 75%);
    }

    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      animation: fadeInUp 0.8s ease-out;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .error-code {
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 900;
      font-family: 'Sora', sans-serif;
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .error-title {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 800;
      margin: 12px 0 8px;
      font-family: 'Sora', sans-serif;
    }

    .error-desc {
      color: rgba(255, 255, 255, 0.5);
      font-size: 1rem;
      max-width: 460px;
      margin: 0 auto 32px;
      line-height: 1.7;
    }

    .btn-row {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .home-btn, .login-btn {
      display: inline-block;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 15px;
      transition: all 0.25s ease;
    }

    .home-btn {
      background: var(--gradient-accent);
      color: white;
      box-shadow: 0 8px 24px rgba(45, 95, 214, 0.4);
    }
    .home-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(45, 95, 214, 0.5); }

    .login-btn {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .login-btn:hover { background: rgba(255, 255, 255, 0.15); color: white; transform: translateY(-2px); }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1c3d68 0%, #2d5fd6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2rem;
      font-weight: 800;
      box-shadow: 0 12px 32px rgba(45, 95, 214, 0.4);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="bg-scene" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="content">
    <div class="logo">A</div>
    <div class="error-code">404</div>
    <h1 class="error-title">Síðan fannst ekki</h1>
    <p class="error-desc">Úps! Síðan sem þú ert að leita að er ekki til eða hefur verið færð. Skoðaðu aðalsíðuna eða skráðu þig inn til að halda áfram.</p>
    <div class="btn-row">
      <a class="home-btn" href="Home.html">🏠 Heim</a>
      <a class="login-btn" href="Login.html">🔐 Skrá inn</a>
    </div>
  </div>
</body>
</html>
