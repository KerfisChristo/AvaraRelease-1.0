<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stofnunartre - Avara</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy-900: #0a1628; --navy-800: #0f213e; --navy-700: #16305a; --navy-600: #1c3d68;
      --blue-500: #2d5fd6; --blue-400: #4d7df0; --cyan-300: #67c1ff; --teal-500: #10b981;
      --ink-900: #0f172a; --ink-700: #334155; --ink-500: #64748b; --ink-300: #94a3b8;
      --bg-soft: #f8fafc; --white: #ffffff;
      --radius-lg: 24px; --radius-md: 16px; --radius-sm: 10px;
      --shadow-lg: 0 24px 60px rgba(15, 23, 42, 0.12);
      --shadow-md: 0 12px 32px rgba(15, 23, 42, 0.08);
      --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.06);
      --gradient-primary: linear-gradient(135deg, #0f213e 0%, #1c3d68 50%, #2d5fd6 100%);
      --gradient-accent: linear-gradient(135deg, #67c1ff 0%, #2d5fd6 100%);
      --bg-body: linear-gradient(180deg, #eef3fb 0%, #f7f7f7 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --border: rgba(15, 23, 42, 0.08);
      --text-primary: var(--ink-900);
      --text-secondary: var(--ink-500);
    }

    html.dark {
      --bg-body: linear-gradient(180deg, #0a1628 0%, #0f213e 100%);
      --card-bg: rgba(15, 23, 42, 0.95);
      --border: rgba(255, 255, 255, 0.08);
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --bg-soft: #0f213e;
      --white: #0f213e;
      --ink-900: #e2e8f0;
      --ink-700: #cbd5e1;
      --ink-500: #94a3b8;
      --ink-300: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--bg-body);
      color: var(--text-primary);
      min-height: 100vh;
      position: relative;
      transition: background 0.3s ease, color 0.3s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(ellipse at 15% 20%, rgba(45, 95, 214, 0.1) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 15%, rgba(16, 185, 129, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 75% 80%, rgba(103, 193, 255, 0.1) 0%, transparent 55%);
    }

    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: #eef3fb; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #1c3d68, #2d5fd6); border-radius: 5px; }
    ::selection { background: rgba(45, 95, 214, 0.2); }

    /* NAV */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      background: rgba(10, 22, 40, 0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      padding: 0 24px;
      gap: 18px;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; flex: 1; overflow-x: auto; }
    .topbar-left::-webkit-scrollbar { display: none; }
    .nav-tab {
      color: rgba(255, 255, 255, 0.75); text-decoration: none; font-weight: 600; padding: 8px 14px;
      transition: all 0.25s ease; white-space: nowrap; border-radius: 999px; font-size: 13px;
    }
    .nav-tab:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .nav-tab.active { background: rgba(45, 95, 214, 0.35); color: #fff; }
    .logo-mini {
      font-family: 'Sora', sans-serif; font-weight: 800; color: #fff; font-size: 18px;
      text-decoration: none; display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .logo-mini span { color: var(--cyan-300); }
    .topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .icon-btn-nav {
      position: relative; background: rgba(255, 255, 255, 0.1); border: none; cursor: pointer;
      font-size: 16px; color: #eaf4ff; width: 38px; height: 38px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .icon-btn-nav:hover { background: rgba(255, 255, 255, 0.2); transform: translateY(-1px); }
    .avatar-nav {
      width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; color: #fff; font-weight: 700; font-size: 13px; cursor: pointer;
      background-size: cover; background-position: center; border: 2px solid rgba(255, 255, 255, 0.2);
      flex-shrink: 0;
    }

    /* MAIN */
    .shell { max-width: 1200px; margin: 32px auto; padding: 0 24px; }

    .page-header {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 16px; margin-bottom: 28px;
    }
    .page-header h1 {
      font-size: clamp(1.4rem, 2vw, 2rem); font-weight: 800; letter-spacing: -0.04em;
      font-family: 'Sora', 'Inter', sans-serif; color: var(--text-primary);
    }
    .page-header p { color: var(--text-secondary); font-size: 0.95rem; margin-top: 4px; }

    /* ORG CHART */
    .org-chart {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .department-section {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-sm);
    }

    .department-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
      padding-bottom: 16px; border-bottom: 2px solid var(--border);
    }

    .department-icon {
      width: 48px; height: 48px; border-radius: 14px; background: var(--gradient-primary);
      display: flex; align-items: center; justify-content: center; font-size: 22px;
      box-shadow: 0 8px 20px rgba(15, 33, 62, 0.25);
    }

    .department-name {
      font-size: 1.2rem; font-weight: 800; color: var(--text-primary);
      font-family: 'Sora', sans-serif; letter-spacing: -0.02em;
    }

    .department-count {
      font-size: 0.8rem; color: var(--text-secondary); font-weight: 600;
    }

    .members-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .member-card {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.25s ease;
    }
    .member-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }

    .member-avatar {
      width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; color: white; font-weight: 700; font-size: 16px;
      background: var(--gradient-primary); flex-shrink: 0;
      background-size: cover; background-position: center;
    }

    .member-info { flex: 1; min-width: 0; }
    .member-name { font-weight: 700; font-size: 0.95rem; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .member-role { font-size: 0.75rem; color: var(--text-secondary); }
    .member-email { font-size: 0.7rem; color: var(--ink-300); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .member-contact {
      display: flex; gap: 6px; margin-top: 6px;
    }

    .member-contact a {
      width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center;
      justify-content: center; font-size: 12px; text-decoration: none;
      background: var(--bg-soft); border: 1px solid var(--border); transition: all 0.2s;
    }
    .member-contact a:hover { background: var(--blue-500); color: white; }

    .empty { text-align: center; color: var(--text-secondary); padding: 60px 20px; font-size: 0.95rem; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    @media (max-width: 768px) {
      .topbar { padding: 0 12px; }
      .topbar-left { overflow-x: auto; }
      .members-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav class="topbar">
    <div class="topbar-left">
      <a class="logo-mini" href="Home.html">A<span>vara</span></a>
      <a class="nav-tab" href="Employee.html">🏠 Heim</a>
      <a class="nav-tab" href="chat.html">💬 Spjall</a>
      <a class="nav-tab" href="Tasks.html">✅ Verkefni</a>
      <a class="nav-tab" href="Announcements.html">📢 Tilkynningar</a>
      <a class="nav-tab" href="Calendar.html">📅 Dagatal</a>
      <a class="nav-tab" href="Documents.html">📁 Skjöl</a>
      <a class="nav-tab" href="Notes.html">📝 Skýrslur</a>
      <a class="nav-tab" href="Leave.html">🏖️ Frí</a>
      <a class="nav-tab" href="Goals.html">🎯 Markmið</a>
      <a class="nav-tab" href="Courses.html">🎓 Námskeið</a>
      <a class="nav-tab active" href="OrgChart.html">🏢 Stofnunartre</a>
      <a class="nav-tab" href="Profile.html">👤 Prófíll</a>
    </div>
    <div class="topbar-right">
      <button class="icon-btn-nav" id="notificationBell" title="Tilkynningar">🔔</button>
      <button class="icon-btn-nav" id="darkModeToggle" title="Dark mode">🌙</button>
      <div class="avatar-nav" id="userAvatar" title="Prófíll" onclick="location.href='Profile.html'">?</div>
    </div>
  </nav>

  <main class="shell">
    <div class="page-header">
      <div>
        <h1>Stofnunartre</h1>
        <p>Yfirlit yfir deildir og starfsmenn fyrirtækisins.</p>
      </div>
    </div>

    <div class="org-chart" id="orgChart">
      <div class="empty">Hleður stofnunartre...</div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    function initials(name) {
      return (name || '?').split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
    }

    function roleLabel(role) {
      const labels = { owner: 'Eigandi', admin: 'Yfirmaður', employee: 'Starfsmaður' };
      return labels[role] || role;
    }

    function departmentIcon(dept) {
      const icons = {
        'fjármál': '💰', 'markaðssetning': '📢', 'sölur': '💼', 'tækni': '💻',
        'mannauður': '👥', 'framleiðsla': '🏭', 'þjónusta': '🤝', 'rannsóknir': '🔬',
        'lögfræði': '⚖️', 'upplýsingatækni': '🖥️', 'hönnun': '🎨', 'viðskipti': '📊'
      };
      const lower = (dept || '').toLowerCase();
      for (const [key, icon] of Object.entries(icons)) {
        if (lower.includes(key)) return icon;
      }
      return '🏢';
    }

    async function loadOrgChart() {
      const container = document.getElementById('orgChart');
      try {
        const response = await app.apiFetch('/api/org-chart');
        const payload = await app.parseJson(response);
        if (!response.ok || !payload.ok) throw new Error(payload.error);

        if (!payload.users.length) {
          container.innerHTML = '<div class="empty">Engir starfsmenn fundust.</div>';
          return;
        }

        // Group by department
        const departments = {};
        payload.users.forEach(user => {
          const dept = user.department || 'Óflokkað';
          if (!departments[dept]) departments[dept] = [];
          departments[dept].push(user);
        });

        container.innerHTML = Object.entries(departments).map(([dept, members]) => `
          <div class="department-section">
            <div class="department-header">
              <div class="department-icon">${departmentIcon(dept)}</div>
              <div>
                <div class="department-name">${app.escapeHtml(dept)}</div>
                <div class="department-count">${members.length} starfsmenn</div>
              </div>
            </div>
            <div class="members-grid">
              ${members.map(user => `
                <div class="member-card">
                  <div class="member-avatar" style="${user.avatarUrl ? `background-image:url('${user.avatarUrl}');` : `background:${user.avatarColor || '#2d5fd6'};`}">
                    ${user.avatarUrl ? '' : initials(user.name || user.email)}
                  </div>
                  <div class="member-info">
                    <div class="member-name">${app.escapeHtml(user.name || user.email)}</div>
                    <div class="member-role">${roleLabel(user.role)}</div>
                    <div class="member-email">${app.escapeHtml(user.email)}</div>
                    <div class="member-contact">
                      <a href="mailto:${user.email}" title="Senda tölvupóst">✉️</a>
                      ${user.phone ? `<a href="tel:${user.phone}" title="Hringja">📞</a>` : ''}
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `).join('');
      } catch (e) {
        container.innerHTML = `<div class="empty">${app.escapeHtml(e.message)}</div>`;
      }
    }

    document.getElementById('darkModeToggle').addEventListener('click', () => app.toggleDarkMode());

    document.addEventListener('DOMContentLoaded', async () => {
      const user = await app.ensureLoggedIn();
      if (!user) return;

      const avatar = document.getElementById('userAvatar');
      if (user.avatarUrl) {
        avatar.style.backgroundImage = `url(${user.avatarUrl})`;
      } else {
        avatar.style.background = user.avatarColor || '#2d5fd6';
        avatar.textContent = initials(user.name || user.email);
      }

      app.user = user;
      app.init();
      await loadOrgChart();
    });
  </script>
</body>
</html>
