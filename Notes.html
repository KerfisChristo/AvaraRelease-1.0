<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skýrslur & Wiki - Avara</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy-900: #0a1628; --navy-800: #0f213e; --navy-700: #16305a; --navy-600: #1c3d68;
      --blue-500: #2d5fd6; --blue-400: #4d7df0; --cyan-300: #67c1ff; --teal-500: #10b981;
      --ink-900: #0f172a; --ink-700: #334155; --ink-500: #64748b; --ink-300: #94a3b8;
      --bg-soft: #f8fafc; --white: #ffffff;
      --radius-lg: 24px; --radius-md: 16px; --radius-sm: 10px;
      --shadow-lg: 0 24px 60px rgba(15, 23, 42, 0.12);
      --shadow-md: 0 12px 32px rgba(15, 23, 42, 0.08);
      --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.06);
      --gradient-primary: linear-gradient(135deg, #0f213e 0%, #1c3d68 50%, #2d5fd6 100%);
      --gradient-accent: linear-gradient(135deg, #67c1ff 0%, #2d5fd6 100%);
      --bg-body: linear-gradient(180deg, #eef3fb 0%, #f7f7f7 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --border: rgba(15, 23, 42, 0.08);
      --text-primary: var(--ink-900);
      --text-secondary: var(--ink-500);
    }

    html.dark {
      --bg-body: linear-gradient(180deg, #0a1628 0%, #0f213e 100%);
      --card-bg: rgba(15, 23, 42, 0.95);
      --border: rgba(255, 255, 255, 0.08);
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --bg-soft: #0f213e;
      --white: #0f213e;
      --ink-900: #e2e8f0;
      --ink-700: #cbd5e1;
      --ink-500: #94a3b8;
      --ink-300: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--bg-body);
      color: var(--text-primary);
      min-height: 100vh;
      position: relative;
      transition: background 0.3s ease, color 0.3s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(ellipse at 15% 20%, rgba(45, 95, 214, 0.1) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 15%, rgba(16, 185, 129, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 75% 80%, rgba(103, 193, 255, 0.1) 0%, transparent 55%);
    }

    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: #eef3fb; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #1c3d68, #2d5fd6); border-radius: 5px; }
    ::selection { background: rgba(45, 95, 214, 0.2); }

    /* NAV */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      background: rgba(10, 22, 40, 0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      padding: 0 24px;
      gap: 18px;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; flex: 1; overflow-x: auto; }
    .topbar-left::-webkit-scrollbar { display: none; }
    .nav-tab {
      color: rgba(255, 255, 255, 0.75); text-decoration: none; font-weight: 600; padding: 8px 14px;
      transition: all 0.25s ease; white-space: nowrap; border-radius: 999px; font-size: 13px;
    }
    .nav-tab:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .nav-tab.active { background: rgba(45, 95, 214, 0.35); color: #fff; }
    .logo-mini {
      font-family: 'Sora', sans-serif; font-weight: 800; color: #fff; font-size: 18px;
      text-decoration: none; display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .logo-mini span { color: var(--cyan-300); }
    .topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .icon-btn-nav {
      position: relative; background: rgba(255, 255, 255, 0.1); border: none; cursor: pointer;
      font-size: 16px; color: #eaf4ff; width: 38px; height: 38px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .icon-btn-nav:hover { background: rgba(255, 255, 255, 0.2); transform: translateY(-1px); }
    .avatar-nav {
      width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; color: #fff; font-weight: 700; font-size: 13px; cursor: pointer;
      background-size: cover; background-position: center; border: 2px solid rgba(255, 255, 255, 0.2);
      flex-shrink: 0;
    }

    /* MAIN */
    .shell { max-width: 1100px; margin: 32px auto; padding: 0 24px; }

    .page-header {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 16px; margin-bottom: 28px;
    }
    .page-header h1 {
      font-size: clamp(1.4rem, 2vw, 2rem); font-weight: 800; letter-spacing: -0.04em;
      font-family: 'Sora', 'Inter', sans-serif; color: var(--text-primary);
    }
    .page-header p { color: var(--text-secondary); font-size: 0.95rem; margin-top: 4px; }

    .btn-primary, .btn-secondary {
      border: none; border-radius: 999px; padding: 12px 24px; font-size: 0.9rem; font-weight: 700;
      cursor: pointer; transition: all 0.25s ease; font-family: inherit; display: inline-flex;
      align-items: center; gap: 8px;
    }
    .btn-primary { background: var(--gradient-primary); color: white; box-shadow: 0 8px 20px rgba(15, 33, 62, 0.3); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(15, 33, 62, 0.4); }
    .btn-secondary { background: var(--bg-soft); color: var(--text-primary); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--blue-500); color: var(--blue-500); }

    /* NOTES */
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .note-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .note-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }

    .note-header {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    }

    .note-title {
      font-size: 1.1rem; font-weight: 800; color: var(--text-primary); flex: 1;
    }

    .note-category {
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      padding: 3px 10px; border-radius: 999px; background: #dbeafe; color: #1e40af;
      flex-shrink: 0;
    }

    .note-body {
      font-size: 0.9rem; color: var(--text-secondary); line-height: 1.6;
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    }

    .note-meta {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.75rem; color: var(--ink-300); margin-top: auto; padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .note-actions {
      display: flex; gap: 8px; margin-top: 8px;
    }

    .note-actions button {
      border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.2s; font-family: inherit;
    }
    .edit-btn { background: var(--bg-soft); color: var(--text-primary); }
    .edit-btn:hover { background: var(--blue-500); color: white; }
    .delete-btn { background: #fee2e2; color: #991b1b; }
    .delete-btn:hover { background: #fecaca; }

    .empty { text-align: center; color: var(--text-secondary); padding: 60px 20px; font-size: 0.95rem; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); z-index: 999;
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--white); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
      width: 100%; max-width: 600px; padding: 32px; animation: fadeInUp 0.3s ease;
      max-height: 90vh; overflow-y: auto;
    }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .modal h2 { font-size: 1.3rem; font-weight: 800; margin-bottom: 20px; color: var(--text-primary); font-family: 'Sora', sans-serif; }
    .field-group { margin-bottom: 16px; }
    .field-group label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; }
    .field-group input, .field-group select, .field-group textarea {
      width: 100%; border: 2px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px;
      font-size: 0.9rem; font-family: inherit; background: var(--white); color: var(--text-primary);
      transition: all 0.25s ease;
    }
    .field-group textarea { min-height: 150px; resize: vertical; }
    .field-group input:focus, .field-group select:focus, .field-group textarea:focus { outline: none; border-color: var(--blue-500); box-shadow: 0 0 0 4px rgba(45, 95, 214, 0.1); }
    .modal-actions { display: flex; gap: 12px; margin-top: 20px; }
    .modal-actions .btn-primary, .modal-actions .btn-secondary { flex: 1; justify-content: center; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    @media (max-width: 768px) {
      .topbar { padding: 0 12px; }
      .topbar-left { overflow-x: auto; }
    }
  </style>
</head>
<body>
  <nav class="topbar">
    <div class="topbar-left">
      <a class="logo-mini" href="Home.html">A<span>vara</span></a>
      <a class="nav-tab" href="Employee.html">🏠 Heim</a>
      <a class="nav-tab" href="chat.html">💬 Spjall</a>
      <a class="nav-tab" href="Tasks.html">✅ Verkefni</a>
      <a class="nav-tab" href="Announcements.html">📢 Tilkynningar</a>
      <a class="nav-tab" href="Calendar.html">📅 Dagatal</a>
      <a class="nav-tab" href="Documents.html">📁 Skjöl</a>
      <a class="nav-tab active" href="Notes.html">📝 Skýrslur</a>
      <a class="nav-tab" href="Profile.html">👤 Prófíll</a>
    </div>
    <div class="topbar-right">
      <button class="icon-btn-nav" id="notificationBell" title="Tilkynningar">🔔</button>
      <button class="icon-btn-nav" id="darkModeToggle" title="Dark mode">🌙</button>
      <div class="avatar-nav" id="userAvatar" title="Prófíll" onclick="location.href='Profile.html'">?</div>
    </div>
  </nav>

  <main class="shell">
    <div class="page-header">
      <div>
        <h1>Skýrslur & Wiki</h1>
        <p>Sameiginlegar skýrslur og þekkingargrunnur fyrirtækisins.</p>
      </div>
      <button class="btn-primary" onclick="openCreateModal()">+ Ný skýrsla</button>
    </div>

    <div class="notes-grid" id="notesList">
      <div class="empty">Hleður skýrslum...</div>
    </div>
  </main>

  <!-- Create/Edit note modal -->
  <div class="modal-overlay" id="createModal">
    <div class="modal">
      <h2 id="modalTitle">Ný skýrsla</h2>
      <form id="noteForm">
        <input type="hidden" id="noteId" />
        <div class="field-group">
          <label for="noteTitle">Titill</label>
          <input type="text" id="noteTitle" required placeholder="Titill skýrslu" />
        </div>
        <div class="field-group">
          <label for="noteCategory">Flokkur</label>
          <select id="noteCategory">
            <option value="general">Almennt</option>
            <option value="process">Ferlar</option>
            <option value="policy">Stefnur</option>
            <option value="guide">Leiðbeiningar</option>
            <option value="reference">Tilvísun</option>
          </select>
        </div>
        <div class="field-group">
          <label for="noteBody">Innihald</label>
          <textarea id="noteBody" required placeholder="Skrifaðu skýrsluna hér..."></textarea>
        </div>
        <div class="modal-actions">
          <button class="btn-secondary" type="button" onclick="closeModal()">Hætta við</button>
          <button class="btn-primary" type="submit">Vista</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    function initials(name) {
      return (name || '?').split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
    }

    function categoryLabel(cat) {
      const labels = { general: 'Almennt', process: 'Ferlar', policy: 'Stefnur', guide: 'Leiðbeiningar', reference: 'Tilvísun' };
      return labels[cat] || cat;
    }

    async function loadNotes() {
      const list = document.getElementById('notesList');
      try {
        const response = await app.apiFetch('/api/notes');
        const payload = await app.parseJson(response);
        if (!response.ok || !payload.ok) throw new Error(payload.error);

        if (!payload.notes.length) {
          list.innerHTML = '<div class="empty">Engar skýrslur ennþá. Búðu til fyrstu skýrsluna!</div>';
          return;
        }

        list.innerHTML = payload.notes.map(note => `
          <div class="note-card">
            <div class="note-header">
              <div class="note-title">${app.escapeHtml(note.title)}</div>
              <span class="note-category">${categoryLabel(note.category)}</span>
            </div>
            <div class="note-body">${app.escapeHtml(note.body)}</div>
            <div class="note-meta">
              <span>${app.escapeHtml(note.author_name || 'Óþekktur')}</span>
              <span>${app.formatDate(note.updated_at)}</span>
            </div>
            <div class="note-actions">
              <button class="edit-btn" onclick="editNote(${note.id})">✏️ Breyta</button>
              <button class="delete-btn" onclick="deleteNote(${note.id})">🗑 Eyða</button>
            </div>
          </div>
        `).join('');
      } catch (e) {
        list.innerHTML = `<div class="empty">${app.escapeHtml(e.message)}</div>`;
      }
    }

    function openCreateModal() {
      document.getElementById('modalTitle').textContent = 'Ný skýrsla';
      document.getElementById('noteForm').reset();
      document.getElementById('noteId').value = '';
      document.getElementById('createModal').classList.add('open');
      document.getElementById('noteTitle').focus();
    }

    function closeModal() {
      document.getElementById('createModal').classList.remove('open');
    }

    async function editNote(id) {
      try {
        const response = await app.apiFetch('/api/notes');
        const payload = await app.parseJson(response);
        if (!response.ok || !payload.ok) throw new Error(payload.error);

        const note = payload.notes.find(n => n.id === id);
        if (!note) return;

        document.getElementById('modalTitle').textContent = 'Breyta skýrslu';
        document.getElementById('noteId').value = note.id;
        document.getElementById('noteTitle').value = note.title;
        document.getElementById('noteCategory').value = note.category;
        document.getElementById('noteBody').value = note.body;
        document.getElementById('createModal').classList.add('open');
      } catch (e) {
        app.toast(e.message, 'error');
      }
    }

    async function deleteNote(id) {
      if (!confirm('Ertu viss um að þú viljir eyða þessari skýrslu?')) return;
      try {
        const response = await app.apiFetch(`/api/notes/${id}`, { method: 'DELETE' });
        const payload = await app.parseJson(response);
        if (!response.ok || !payload.ok) throw new Error(payload.error);
        app.toast('Skýrslu eyddi');
        await loadNotes();
      } catch (e) {
        app.toast(e.message, 'error');
      }
    }

    document.getElementById('noteForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('noteId').value;
      const title = document.getElementById('noteTitle').value.trim();
      const category = document.getElementById('noteCategory').value;
      const body = document.getElementById('noteBody').value.trim();

      try {
        const url = id ? `/api/notes/${id}` : '/api/notes';
        const method = id ? 'PUT' : 'POST';
        const response = await app.apiFetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, body, category })
        });
        const payload = await app.parseJson(response);
        if (!response.ok || !payload.ok) throw new Error(payload.error);
        app.toast(id ? 'Skýrsla uppfærð!' : 'Skýrsla búin til!');
        closeModal();
        await loadNotes();
      } catch (err) {
        app.toast(err.message, 'error');
      }
    });

    document.getElementById('darkModeToggle').addEventListener('click', () => app.toggleDarkMode());

    document.addEventListener('DOMContentLoaded', async () => {
      const user = await app.ensureLoggedIn();
      if (!user) return;

      const avatar = document.getElementById('userAvatar');
      if (user.avatarUrl) {
        avatar.style.backgroundImage = `url(${user.avatarUrl})`;
      } else {
        avatar.style.background = user.avatarColor || '#2d5fd6';
        avatar.textContent = initials(user.name || user.email);
      }

      app.user = user;
      app.init();
      await loadNotes();
    });
  </script>
</body>
</html>
