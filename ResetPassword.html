<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Endurstilla lykilorð - Avara</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy-900: #0a1628;
      --navy-800: #0f213e;
      --navy-700: #16305a;
      --navy-600: #1c3d68;
      --blue-500: #2d5fd6;
      --blue-400: #4d7df0;
      --cyan-300: #67c1ff;
      --cyan-200: #9fe7ff;
      --teal-500: #10b981;
      --teal-400: #34d399;
      --gold-400: #ffd166;
      --ink-900: #0f172a;
      --ink-700: #334155;
      --ink-500: #64748b;
      --ink-300: #94a3b8;
      --bg-soft: #f8fafc;
      --white: #ffffff;
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 10px;
      --shadow-lg: 0 24px 60px rgba(15, 23, 42, 0.12);
      --shadow-md: 0 12px 32px rgba(15, 23, 42, 0.08);
      --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.06);
      --gradient-primary: linear-gradient(135deg, #0f213e 0%, #1c3d68 50%, #2d5fd6 100%);
      --gradient-accent: linear-gradient(135deg, #67c1ff 0%, #2d5fd6 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #060d1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .bg-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #060d1a 0%, #0a1a33 50%, #0d1f3d 100%);
    }

    .bg-scene::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(45, 95, 214, 0.35) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 30%, rgba(16, 185, 129, 0.18) 0%, transparent 45%),
        radial-gradient(ellipse at 70% 80%, rgba(103, 193, 255, 0.2) 0%, transparent 50%);
      animation: aurora 16s ease-in-out infinite alternate;
    }

    @keyframes aurora {
      0% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
      100% { opacity: 0.8; transform: scale(1.02); }
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
      animation: float 12s ease-in-out infinite;
    }

    .orb-1 { width: 400px; height: 400px; background: rgba(45, 95, 214, 0.4); top: -100px; left: -100px; }
    .orb-2 { width: 350px; height: 350px; background: rgba(16, 185, 129, 0.2); bottom: -100px; right: -80px; animation-delay: -4s; }
    .orb-3 { width: 250px; height: 250px; background: rgba(103, 193, 255, 0.25); top: 50%; left: 60%; animation-delay: -8s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); }
      33% { transform: translateY(-30px) translateX(20px); }
      66% { transform: translateY(20px) translateX(-20px); }
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(103, 193, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(103, 193, 255, 0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center, black 0%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 75%);
    }

    .reset-container {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: var(--radius-lg);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      padding: 48px;
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
      animation: fadeInUp 0.6s ease-out;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .reset-container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--gradient-accent);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }

    .reset-header {
      text-align: center;
      margin-bottom: 36px;
    }

    .reset-logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1c3d68 0%, #2d5fd6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2.2rem;
      font-weight: 800;
      box-shadow: 0 12px 32px rgba(45, 95, 214, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .reset-header h1 {
      color: #ffffff;
      font-size: 28px;
      margin: 0 0 8px;
      font-weight: 800;
      letter-spacing: -0.03em;
      font-family: 'Sora', 'Inter', sans-serif;
    }

    .reset-header p {
      color: rgba(255, 255, 255, 0.5);
      font-size: 14px;
      margin: 0;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-sm);
      font-size: 14px;
      transition: all 0.25s ease;
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      font-family: inherit;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--blue-400);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 4px rgba(45, 95, 214, 0.2);
    }

    .form-group input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .reset-btn {
      width: 100%;
      padding: 16px;
      background: var(--gradient-accent);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 16px;
      font-family: inherit;
      box-shadow: 0 8px 24px rgba(45, 95, 214, 0.4);
    }

    .reset-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(45, 95, 214, 0.5);
    }

    .reset-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .status-msg {
      margin-top: 16px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      display: none;
    }

    .status-msg.success { display: block; color: #34d399; }
    .status-msg.error { display: block; color: #f87171; }

    .back-home {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 10;
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      transition: all 0.25s ease;
    }

    .back-home:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
      transform: translateX(-4px);
    }

    .back-home svg {
      width: 16px;
      height: 16px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 480px) {
      .reset-container { padding: 32px 24px; }
    }
  </style>
</head>
<body>
  <a class="back-home" href="Login.html">
    <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>
    Til baka
  </a>

  <div class="bg-scene" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="reset-container">
    <div class="reset-header">
      <div class="reset-logo">A</div>
      <h1>Endurstilla lykilorð</h1>
      <p>Enter your new password below</p>
    </div>

    <form id="resetForm">
      <div class="form-group">
        <label for="newPassword">Nýtt lykilorð</label>
        <input type="password" id="newPassword" placeholder="Enter new password" minlength="6" required />
      </div>
      <div class="form-group">
        <label for="confirmPassword">Staðfesta lykilorð</label>
        <input type="password" id="confirmPassword" placeholder="Confirm new password" minlength="6" required />
      </div>
      <button type="submit" class="reset-btn" id="submitBtn">Endurstilla lykilorð</button>
      <p class="status-msg" id="statusMsg"></p>
    </form>
  </div>

  <script>
    const apiBase = (location.port && location.port !== '3000') ? 'http://localhost:3000' : '';
    function apiFetch(path, opts) {
      const fetchOpts = { ...opts };
      if (apiBase) {
        fetchOpts.credentials = 'include';
      }
      return fetch((apiBase || '') + path, fetchOpts);
    }

    async function parseJsonResponse(response) {
      const text = await response.text();
      return text ? JSON.parse(text) : {};
    }

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      document.getElementById('statusMsg').textContent = 'Invalid reset link. Please request a new one.';
      document.getElementById('statusMsg').className = 'status-msg error';
      document.getElementById('submitBtn').disabled = true;
    }

    document.getElementById('resetForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const statusEl = document.getElementById('statusMsg');
      const submitBtn = document.getElementById('submitBtn');

      if (newPassword !== confirmPassword) {
        statusEl.textContent = 'Passwords do not match.';
        statusEl.className = 'status-msg error';
        return;
      }

      submitBtn.disabled = true;
      try {
        const response = await apiFetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });
        const payload = await parseJsonResponse(response);
        if (!response.ok || !payload.ok) {
          throw new Error(payload.error || 'Unable to reset password.');
        }
        statusEl.textContent = 'Password reset successfully! Redirecting to login...';
        statusEl.className = 'status-msg success';
        setTimeout(() => {
          window.location.href = (apiBase || '') + '/Login.html';
        }, 2000);
      } catch (error) {
        statusEl.textContent = error.message || 'Unable to reset password.';
        statusEl.className = 'status-msg error';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
