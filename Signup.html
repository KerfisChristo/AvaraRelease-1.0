<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Avara</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy-900: #0a1628;
      --navy-800: #0f213e;
      --navy-700: #16305a;
      --navy-600: #1c3d68;
      --blue-500: #2d5fd6;
      --blue-400: #4d7df0;
      --cyan-300: #67c1ff;
      --cyan-200: #9fe7ff;
      --teal-500: #10b981;
      --teal-400: #34d399;
      --gold-400: #ffd166;
      --ink-900: #0f172a;
      --ink-700: #334155;
      --ink-500: #64748b;
      --ink-300: #94a3b8;
      --bg-soft: #f8fafc;
      --white: #ffffff;
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 10px;
      --shadow-lg: 0 24px 60px rgba(15, 23, 42, 0.12);
      --shadow-md: 0 12px 32px rgba(15, 23, 42, 0.08);
      --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.06);
      --gradient-primary: linear-gradient(135deg, #0f213e 0%, #1c3d68 50%, #2d5fd6 100%);
      --gradient-accent: linear-gradient(135deg, #67c1ff 0%, #2d5fd6 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #060d1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* ===== ANIMATED AURORA BACKGROUND ===== */
    .bg-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #060d1a 0%, #0a1a33 50%, #0d1f3d 100%);
    }

    .bg-scene::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(45, 95, 214, 0.35) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 30%, rgba(16, 185, 129, 0.18) 0%, transparent 45%),
        radial-gradient(ellipse at 70% 80%, rgba(103, 193, 255, 0.2) 0%, transparent 50%),
        radial-gradient(ellipse at 20% 85%, rgba(255, 209, 102, 0.1) 0%, transparent 40%);
      animation: aurora 16s ease-in-out infinite alternate;
    }

    @keyframes aurora {
      0% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
      100% { opacity: 0.8; transform: scale(1.02); }
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
      animation: float 12s ease-in-out infinite;
    }

    .orb-1 {
      width: 400px;
      height: 400px;
      background: rgba(45, 95, 214, 0.4);
      top: -100px;
      left: -100px;
    }

    .orb-2 {
      width: 350px;
      height: 350px;
      background: rgba(16, 185, 129, 0.2);
      bottom: -100px;
      right: -80px;
      animation-delay: -4s;
    }

    .orb-3 {
      width: 250px;
      height: 250px;
      background: rgba(103, 193, 255, 0.25);
      top: 50%;
      left: 60%;
      animation-delay: -8s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); }
      33% { transform: translateY(-30px) translateX(20px); }
      66% { transform: translateY(20px) translateX(-20px); }
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(103, 193, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(103, 193, 255, 0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center, black 0%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 75%);
    }

    .signup-container {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: var(--radius-lg);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      padding: 48px;
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
      animation: fadeInUp 0.6s ease-out;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .signup-container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--gradient-accent);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }

    .signup-header {
      text-align: center;
      margin-bottom: 36px;
    }

    .signup-logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1c3d68 0%, #2d5fd6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2.2rem;
      font-weight: 800;
      box-shadow: 0 12px 32px rgba(45, 95, 214, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      position: relative;
    }

    .signup-logo::after {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1px solid rgba(103, 193, 255, 0.2);
      animation: pulse-ring 2.5s ease-out infinite;
    }

    @keyframes pulse-ring {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.3); opacity: 0; }
    }

    .signup-header h1 {
      color: #ffffff;
      font-size: 28px;
      margin: 0;
      margin-bottom: 8px;
      font-weight: 800;
      letter-spacing: -0.03em;
      font-family: 'Sora', 'Inter', sans-serif;
    }

    .signup-header p {
      color: rgba(255, 255, 255, 0.5);
      font-size: 14px;
      margin: 0;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.3);
      font-size: 16px;
      pointer-events: none;
      transition: color 0.25s ease;
    }

    .form-group input {
      width: 100%;
      padding: 14px 18px 14px 44px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-sm);
      font-size: 14px;
      transition: all 0.25s ease;
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      font-family: inherit;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--blue-400);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 4px rgba(45, 95, 214, 0.2);
    }

    .form-group input:focus ~ .input-icon,
    .form-group input:focus + .input-icon {
      color: var(--cyan-300);
    }

    .form-group input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: rgba(255, 255, 255, 0.4);
      padding: 4px;
      transition: color 0.2s ease;
    }

    .password-toggle:hover {
      color: var(--cyan-300);
    }

    .signup-btn {
      width: 100%;
      padding: 16px;
      background: var(--gradient-accent);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 16px;
      font-family: inherit;
      box-shadow: 0 8px 24px rgba(45, 95, 214, 0.4);
      position: relative;
      overflow: hidden;
    }

    .signup-btn::after {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s ease;
    }

    .signup-btn:hover::after {
      left: 100%;
    }

    .signup-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(45, 95, 214, 0.5);
    }

    .signup-btn:active {
      transform: translateY(0);
    }

    .signup-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .signup-btn .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto;
    }

    .signup-btn.loading .spinner {
      display: block;
    }

    .signup-btn.loading .btn-text {
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 28px 0;
      gap: 12px;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    .divider-text {
      color: rgba(255, 255, 255, 0.3);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .login-section {
      text-align: center;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .login-section p {
      color: rgba(255, 255, 255, 0.5);
      font-size: 14px;
      margin: 0 0 12px 0;
    }

    .login-btn {
      display: inline-block;
      padding: 12px 28px;
      background: transparent;
      color: var(--cyan-300);
      border: 2px solid rgba(103, 193, 255, 0.3);
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .login-btn:hover {
      background: rgba(103, 193, 255, 0.1);
      border-color: var(--cyan-300);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(45, 95, 214, 0.3);
    }

    .terms-wrapper {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 20px;
      font-size: 12px;
    }

    .terms-wrapper input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--blue-400);
      margin-top: 2px;
      flex-shrink: 0;
    }

    .terms-wrapper label {
      color: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      line-height: 1.4;
    }

    .terms-wrapper a {
      color: var(--cyan-300);
      text-decoration: none;
      font-weight: 600;
    }

    .terms-wrapper a:hover {
      text-decoration: underline;
    }

    .back-home {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 10;
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      transition: all 0.25s ease;
    }

    .back-home:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
      transform: translateX(-4px);
    }

    .back-home svg {
      width: 16px;
      height: 16px;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #0a1628;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #1c3d68, #2d5fd6);
      border-radius: 5px;
    }

    ::selection {
      background: rgba(45, 95, 214, 0.5);
      color: #fff;
    }

    :focus-visible {
      outline: 2px solid var(--cyan-300);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 480px) {
      .signup-container {
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>
  <a class="back-home" href="Home.html">
    <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>
    Heim
  </a>

  <div class="bg-scene" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="signup-container">
    <div class="signup-header">
      <div class="signup-logo">A</div>
      <h1>Create Account</h1>
      <p>Join Avara and get started</p>
    </div>

    <form id="signupForm">
      <div class="form-group">
        <label for="fullname">Full Name</label>
        <div class="input-wrap">
          <input 
            type="text" 
            id="fullname" 
            name="fullname" 
            placeholder="John Doe" 
            required
          />
          <span class="input-icon">👤</span>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="your@email.com" 
            required
          />
          <span class="input-icon">✉️</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Create a strong password" 
            required
          />
          <span class="input-icon">🔒</span>
          <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">👁️</button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <div class="input-wrap">
          <input 
            type="password" 
            id="confirm-password" 
            name="confirm-password" 
            placeholder="Confirm your password" 
            required
          />
          <span class="input-icon">🔐</span>
          <button type="button" class="password-toggle" id="toggleConfirmPassword" aria-label="Toggle confirm password visibility">👁️</button>
        </div>
      </div>

      <div class="terms-wrapper">
        <input type="checkbox" id="terms" name="terms" required />
        <label for="terms">
          I agree to the <a href="#terms">Terms of Service</a> and <a href="#privacy">Privacy Policy</a>
        </label>
      </div>

      <button type="submit" class="signup-btn" id="submitBtn">
        <span class="spinner"></span>
        <span class="btn-text">Create Account</span>
      </button>
    </form>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">EXISTING USER</span>
      <div class="divider-line"></div>
    </div>

    <div class="login-section">
      <p>Already have an account?</p>
      <a href="Login.html" class="login-btn">Sign In</a>
    </div>
  </div>

  <script>
    const apiBase = (location.port && location.port !== '3000') ? 'http://localhost:3000' : '';
    function apiFetch(path, opts) {
      const fetchOpts = { ...opts };
      if (apiBase) {
        fetchOpts.credentials = 'include';
      }
      return fetch((apiBase || '') + path, fetchOpts);
    }

    async function parseJsonResponse(response) {
      const text = await response.text();
      return text ? JSON.parse(text) : {};
    }

    // Password visibility toggles
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    togglePassword.addEventListener('click', () => {
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
      togglePassword.textContent = type === 'password' ? '👁️' : '🙈';
    });

    const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
    const confirmPasswordInput = document.getElementById('confirm-password');
    toggleConfirmPassword.addEventListener('click', () => {
      const type = confirmPasswordInput.type === 'password' ? 'text' : 'password';
      confirmPasswordInput.type = type;
      toggleConfirmPassword.textContent = type === 'password' ? '👁️' : '🙈';
    });

    document.getElementById('signupForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (password !== confirmPassword) {
        alert('Passwords do not match!');
        return;
      }

      const fullname = document.getElementById('fullname').value.trim();
      const email = document.getElementById('email').value.trim();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.classList.add('loading');

      try {
        const response = await apiFetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fullname, email, password })
        });

        const payload = await parseJsonResponse(response);

        if (!response.ok || !payload.ok) {
          throw new Error(payload.error || 'Unable to create account.');
        }

        window.location.href = payload.redirect || (apiBase || '') + '/Employee.html';
      } catch (error) {
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
        alert(error.message || 'Unable to create account.');
      }
    });
  </script>
</body>
</html>
