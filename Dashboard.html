<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yfirlit - Avara Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy-900: #0a1628;
      --navy-800: #0f213e;
      --navy-700: #16305a;
      --navy-600: #1c3d68;
      --blue-500: #2d5fd6;
      --blue-400: #4d7df0;
      --cyan-300: #67c1ff;
      --cyan-200: #9fe7ff;
      --teal-500: #10b981;
      --teal-400: #34d399;
      --gold-400: #ffd166;
      --ink-900: #0f172a;
      --ink-700: #334155;
      --ink-500: #64748b;
      --ink-300: #94a3b8;
      --bg-soft: #f8fafc;
      --white: #ffffff;
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 10px;
      --shadow-lg: 0 24px 60px rgba(15, 23, 42, 0.12);
      --shadow-md: 0 12px 32px rgba(15, 23, 42, 0.08);
      --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.06);
      --gradient-primary: linear-gradient(135deg, #0f213e 0%, #1c3d68 50%, #2d5fd6 100%);
      --gradient-accent: linear-gradient(135deg, #67c1ff 0%, #2d5fd6 100%);
      --gradient-gold: linear-gradient(135deg, #ffd166 0%, #f59e0b 100%);
      --gradient-teal: linear-gradient(135deg, #34d399 0%, #0f766e 100%);
      --gradient-purple: linear-gradient(135deg, #a78bfa 0%, #6d28d9 100%);
      --gradient-pink: linear-gradient(135deg, #f472b6 0%, #be123c 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, #eef3fb 0%, #f7f7f7 100%);
      color: var(--ink-900);
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(ellipse at 15% 20%, rgba(45, 95, 214, 0.1) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 15%, rgba(16, 185, 129, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 75% 80%, rgba(103, 193, 255, 0.1) 0%, transparent 55%);
    }

    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: #eef3fb; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #1c3d68, #2d5fd6); border-radius: 5px; border: 2px solid #eef3fb; }
    ::selection { background: rgba(45, 95, 214, 0.2); }
    :focus-visible { outline: 2px solid var(--blue-500); outline-offset: 2px; }

    .shell {
      max-width: 1280px;
      margin: 32px auto 60px;
      padding: 0 20px;
      animation: fadeInUp 0.5s ease-out;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== TOP BANNER ===== */
    .banner {
      border-radius: var(--radius-lg);
      background: var(--gradient-primary);
      color: white;
      padding: 36px 40px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(15, 33, 62, 0.3);
      margin-bottom: 28px;
    }

    .banner::before {
      content: "";
      position: absolute;
      top: -40%;
      right: -5%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(103, 193, 255, 0.18) 0%, transparent 60%);
    }

    .banner::after {
      content: "";
      position: absolute;
      bottom: -60%;
      left: -8%;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(255, 209, 102, 0.12) 0%, transparent 60%);
    }

    .banner-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
      margin-bottom: 22px;
    }

    .banner h1 {
      font-size: clamp(1.5rem, 2.5vw, 2.1rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      font-family: 'Sora', 'Inter', sans-serif;
      margin: 0;
    }

    .banner p {
      color: rgba(255, 255, 255, 0.65);
      font-size: 0.95rem;
      margin: 6px 0 0;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: white;
      padding: 11px 20px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .back-btn:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 20px rgba(11, 31, 54, 0.3);
    }

    .banner-stats {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    .banner-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      padding: 9px 18px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #eaf4ff;
    }

    .banner-pill strong {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
    }

    /* ===== KPI GRID ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 18px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--white);
      border: 1px solid rgba(15, 23, 42, 0.07);
      border-radius: var(--radius-md);
      padding: 22px;
      box-shadow: var(--shadow-sm);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--card-accent, var(--gradient-accent));
      opacity: 0.7;
      transition: opacity 0.3s;
    }

    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-lg);
    }

    .stat-card:hover::before {
      opacity: 1;
    }

    .stat-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .stat-icon {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      background: var(--card-accent, var(--gradient-accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: white;
      box-shadow: 0 8px 18px rgba(15, 33, 62, 0.15);
    }

    .stat-card strong {
      display: block;
      font-size: 2rem;
      letter-spacing: -0.03em;
      font-weight: 800;
      color: var(--ink-900);
      line-height: 1.1;
    }

    .stat-card span {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-500);
      font-weight: 600;
      margin-top: 4px;
      display: block;
    }

    /* ===== CHARTS ===== */
    .charts-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 20px;
      margin-bottom: 28px;
    }

    .chart-panel {
      background: var(--white);
      border: 1px solid rgba(15, 23, 42, 0.07);
      border-radius: var(--radius-md);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      transition: all 0.3s ease;
    }

    .chart-panel:hover {
      box-shadow: var(--shadow-md);
      border-color: rgba(45, 95, 214, 0.15);
    }

    .chart-panel h2 {
      margin: 0 0 18px;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--ink-900);
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Sora', 'Inter', sans-serif;
    }

    .chart-panel h2 .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-left: auto;
    }

    .chart-bars {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      height: 170px;
      padding-top: 10px;
    }

    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .bar-value {
      font-size: 9px;
      font-weight: 800;
      color: var(--ink-500);
    }

    .bar {
      width: 100%;
      max-width: 42px;
      border-radius: 7px 7px 3px 3px;
      min-height: 3px;
      transition: height 0.6s ease, transform 0.2s;
    }

    .bar:hover {
      transform: scaleY(1.05);
      filter: brightness(1.1);
    }

    .bar-label {
      font-size: 9px;
      color: var(--ink-300);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .chart-footer {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(15, 23, 42, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--ink-500);
    }

    .chart-footer strong {
      color: var(--ink-900);
    }

    .mini-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.12);
      color: #0f9d6c;
    }

    /* ===== PANELS ===== */
    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .panel {
      background: var(--white);
      border: 1px solid rgba(15, 23, 42, 0.07);
      border-radius: var(--radius-md);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      max-height: 520px;
      overflow-y: auto;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .panel:hover {
      border-color: rgba(45, 95, 214, 0.15);
      box-shadow: var(--shadow-md);
    }

    .panel h2 {
      margin: 0 0 16px;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--ink-900);
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Sora', 'Inter', sans-serif;
    }

    .panel h2 .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-left: auto;
    }

    .list-item {
      padding: 14px 12px;
      border-bottom: 1px solid rgba(15, 23, 42, 0.06);
      font-size: 0.88rem;
      transition: background 0.2s ease;
      border-radius: 10px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .list-item:last-child {
      border-bottom: none;
    }

    .list-item:hover {
      background: rgba(45, 95, 214, 0.04);
    }

    .list-avatar {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--gradient-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: white;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(45, 95, 214, 0.2);
    }

    .list-body {
      flex: 1;
      min-width: 0;
    }

    .list-body strong {
      font-size: 0.9rem;
      color: var(--ink-900);
    }

    .list-body .text {
      font-size: 0.82rem;
      color: var(--ink-500);
      line-height: 1.5;
      margin-top: 2px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .list-body .meta {
      color: var(--ink-300);
      font-size: 0.72rem;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .status-tag {
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 3px 10px;
      border-radius: 999px;
      font-style: normal;
    }

    .status-tag.new { background: #dbeafe; color: #1e40af; }
    .status-tag.contacted { background: #fef3c7; color: #92400e; }
    .status-tag.closed { background: #d1fae5; color: #065f46; }

    .action-chip {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      background: #eef2fa;
      color: var(--ink-500);
    }

    .empty {
      color: var(--ink-300);
      font-size: 0.9rem;
      text-align: center;
      padding: 32px 0;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 820px) {
      .panels { grid-template-columns: 1fr; }
      .banner { padding: 28px 24px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="banner">
      <div class="banner-top">
        <div>
          <h1 id="bannerTitle">Yfirlit & virkni</h1>
          <p id="bannerSubtitle">Velkomin/n aftur! Hér sérðu helstu mælikvarða fyrirtækisins.</p>
        </div>
        <a class="back-btn" href="admin.html">← Til baka</a>
      </div>
      <div class="banner-stats" id="bannerStats"></div>
    </div>

    <div class="stats-grid" id="statsGrid"></div>

    <div class="charts-row" id="analyticsCharts"></div>

    <div class="panels">
      <div class="panel">
        <h2>✉️ Nýjustu fyrirspurnir <span class="dot" style="background:var(--gradient-accent);"></span></h2>
        <div id="leadsList"></div>
      </div>
      <div class="panel">
        <h2>🕒 Aðgerðaskrá (audit log) <span class="dot" style="background:var(--gradient-teal);"></span></h2>
        <div id="auditList"></div>
      </div>
    </div>
  </div>

  <script>
    const apiBase = (location.port && location.port !== '3000') ? 'http://localhost:3000' : '';
    function apiFetch(path, opts) {
      const fetchOpts = { ...opts };
      if (apiBase) {
        fetchOpts.credentials = 'include';
      }
      return fetch((apiBase || '') + path, fetchOpts);
    }

    async function parseJsonResponse(response) {
      const text = await response.text();
      return text ? JSON.parse(text) : {};
    }

    async function ensureLoggedIn() {
      try {
        const response = await apiFetch('/api/admin/session');
        const payload = await parseJsonResponse(response);
        if (!payload.loggedIn) {
          window.location.href = 'Login.html';
          return null;
        }
        return payload.user;
      } catch (error) {
        window.location.href = 'Login.html';
        return null;
      }
    }

    function formatDate(value) {
      return new Date(value).toLocaleString('is-IS', { dateStyle: 'medium', timeStyle: 'short' });
    }

    const STAT_META = {
      users: { icon: '👥', accent: 'var(--gradient-primary)' },
      groups: { icon: '👥', accent: 'var(--gradient-accent)' },
      directMessages: { icon: '💬', accent: 'var(--gradient-teal)' },
      messages: { icon: '✉️', accent: 'var(--gradient-purple)' },
      leads: { icon: '📋', accent: 'var(--gradient-gold)' },
      tasks: { icon: '✅', accent: 'var(--gradient-teal)' },
      announcements: { icon: '📢', accent: 'var(--gradient-pink)' },
      documents: { icon: '📁', accent: 'var(--gradient-primary)' }
    };

    async function loadStats() {
      try {
        const response = await apiFetch('/api/admin/stats');
        const payload = await parseJsonResponse(response);
        if (!response.ok || !payload.ok) throw new Error(payload.error);

        const labels = {
          users: 'Notendur',
          groups: 'Hópar',
          directMessages: 'Bein spjöll',
          messages: 'Skilaboð',
          leads: 'Fyrirspurnir',
          tasks: 'Verkefni',
          announcements: 'Tilkynningar',
          documents: 'Skjöl'
        };

        const grid = document.getElementById('statsGrid');
        grid.innerHTML = Object.entries(payload.stats).map(([key, value]) => {
          const meta = STAT_META[key] || { icon: '✨', accent: 'var(--gradient-accent)' };
          return `
            <div class="stat-card" style="--card-accent:${meta.accent};">
              <div class="stat-head">
                <div class="stat-icon" style="background:${meta.accent};">${meta.icon}</div>
              </div>
              <strong>${value}</strong>
              <span>${labels[key] || key}</span>
            </div>
          `;
        }).join('');

        const banner = document.getElementById('bannerStats');
        const s = payload.stats;
        banner.innerHTML = `
          <span class="banner-pill">👥 <strong>${s.users}</strong> Notendur</span>
          <span class="banner-pill">✉️ <strong>${s.messages}</strong> Skilaboð</span>
          <span class="banner-pill">📋 <strong>${s.leads}</strong> Fyrirspurnir</span>
          <span class="banner-pill">✅ <strong>${s.tasks}</strong> Verkefni</span>
        `;
      } catch (error) {
        console.error('Error loading stats:', error);
      }
    }

    async function loadLeads() {
      try {
        const response = await apiFetch('/api/admin/leads');
        const payload = await parseJsonResponse(response);
        if (!response.ok || !payload.ok) throw new Error(payload.error);

        const list = document.getElementById('leadsList');
        if (!payload.leads.length) {
          list.innerHTML = '<p class="empty">Engar fyrirspurnir ennþá.</p>';
          return;
        }

        list.innerHTML = payload.leads.map((lead) => `
          <div class="list-item">
            <div class="list-avatar">📋</div>
            <div class="list-body">
              <strong>${lead.name}</strong>
              <div class="text">${lead.message}</div>
              <div class="meta">
                <span>✉️ ${lead.email}</span>
                <span>•</span>
                <span>${formatDate(lead.createdAt)}</span>
                <em class="status-tag ${lead.status}">${lead.status}</em>
              </div>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Error loading leads:', error);
      }
    }

    async function loadAnalytics() {
      try {
        const response = await apiFetch('/api/admin/analytics');
        const payload = await parseJsonResponse(response);
        if (!response.ok || !payload.ok) throw new Error(payload.error);

        const charts = document.getElementById('analyticsCharts');
        if (!charts) return;

        const msgs = payload.analytics.messagesPerDay || [];
        const signups = payload.analytics.signupsPerDay || [];
        const topUsers = payload.analytics.topUsers || [];

        const maxMsg = Math.max(...msgs.map(m => m.count), 1);
        const maxSignup = Math.max(...signups.map(s => s.count), 1);

        const colors = ['#2d5fd6', '#67c1ff', '#10b981', '#ffd166', '#f472b6'];

        charts.innerHTML = `
          <div class="chart-panel">
            <h2>💬 Skilaboð síðustu 14 daga <span class="dot" style="background:var(--gradient-accent);"></span></h2>
            <div class="chart-bars">
              ${msgs.map(m => `
                <div class="bar-col">
                  <div class="bar-value">${m.count}</div>
                  <div class="bar" style="height:${Math.round((m.count / maxMsg) * 130)}px;background:var(--gradient-accent);"></div>
                  <div class="bar-label">${m.day}</div>
                </div>
              `).join('') || '<p class="empty">Engin gögn</p>'}
            </div>
            <div class="chart-footer">
              <span>Virkt fólk (7 d): <strong>${payload.analytics.activeUsers || 0}</strong></span>
              <span class="mini-badge">● rauntími</span>
            </div>
          </div>

          <div class="chart-panel">
            <h2>📈 Nýskráningar síðustu 14 daga <span class="dot" style="background:var(--gradient-teal);"></span></h2>
            <div class="chart-bars">
              ${signups.map(s => `
                <div class="bar-col">
                  <div class="bar-value">${s.count}</div>
                  <div class="bar" style="height:${Math.round((s.count / maxSignup) * 130)}px;background:var(--gradient-teal);"></div>
                  <div class="bar-label">${s.day}</div>
                </div>
              `).join('') || '<p class="empty">Engin gögn</p>'}
            </div>
            <div class="chart-footer">
              <span>Virkustu meðlimir:</span>
              <span style="display:flex;gap:6px;flex-wrap:wrap;">
                ${topUsers.map((u, i) => `<span class="action-chip" style="background:${colors[i % colors.length]}20;color:var(--ink-700);">${u.name}</span>`).join('') || '<span class="action-chip">Engir gögn</span>'}
              </span>
            </div>
          </div>
        `;
      } catch (e) {
        console.error('Error loading analytics:', e);
      }
    }

    async function loadAuditLog() {
      try {
        const response = await apiFetch('/api/admin/audit-log');
        const payload = await parseJsonResponse(response);
        if (!response.ok || !payload.ok) throw new Error(payload.error);

        const list = document.getElementById('auditList');
        if (!payload.entries.length) {
          list.innerHTML = '<p class="empty">Engar aðgerðir skráðar ennþá.</p>';
          return;
        }

        const actionIcons = { role_change: '🎭', user_delete: '🗑️', user_activate: '✅', user_deactivate: '⛔', message_delete: '✉️' };

        list.innerHTML = payload.entries.map((entry) => `
          <div class="list-item">
            <div class="list-avatar">${actionIcons[entry.action] || '⚡'}</div>
            <div class="list-body">
              <strong>${entry.actorName}</strong>
              <div class="text">${entry.details || entry.action}</div>
              <div class="meta">
                <span>${formatDate(entry.createdAt)}</span>
                <span>•</span>
                <em class="action-chip">${entry.action}</em>
              </div>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Error loading audit log:', error);
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const user = await ensureLoggedIn();
      if (!user) return;

      if (user.role !== 'admin' && user.role !== 'owner') {
        window.location.href = (apiBase || '') + '/Employee.html';
        return;
      }

      const name = (user.name || '').split(' ')[0];
      if (name) {
        document.getElementById('bannerTitle').textContent = `Velkomin/n, ${name}!`;
        document.getElementById('bannerSubtitle').textContent = 'Hér sérðu helstu mælikvarða fyrirtækisins í dag.';
      }

      await Promise.all([loadStats(), loadAnalytics(), loadLeads(), loadAuditLog()]);
    });
  </script>
</body>
</html>
