# Deploy only the public homepage and its contact endpoint. The internal app and
# its database are intentionally not included in this service.
services:
  - type: web
    name: avara-contact-api
    env: node
    plan: free
    rootDir: public-contact
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MS_TENANT_ID
        sync: false
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_REFRESH_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
